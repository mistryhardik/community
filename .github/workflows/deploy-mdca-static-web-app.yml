name: Deploy MDCA Static Web App

on:
  push:
    branches:
      - development
    paths:
      - mdca/mdca dotnetdays 12/app/**
      - .github/workflows/deploy-mdca-static-web-app.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APIM_URL: ${{ vars.WORKSHOP_APIM_URL }}
      APIM_SUBSCRIPTION_KEY: ${{ secrets.WORKSHOP_APIM_SUBSCRIPTION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate runtime config
        run: |
          cp "mdca/mdca dotnetdays 12/app/config.js.template" "mdca/mdca dotnetdays 12/app/config.js"
          python3 - <<'PY'
          from pathlib import Path
          import os

          config_path = Path("mdca/mdca dotnetdays 12/app/config.js")
          config = config_path.read_text()

          apim_url = os.environ.get("APIM_URL", "").strip()
          apim_key = os.environ.get("APIM_SUBSCRIPTION_KEY", "").strip()

          if not apim_url:
              raise SystemExit("Missing GitHub variable WORKSHOP_APIM_URL")

          if not apim_key:
              raise SystemExit("Missing GitHub secret WORKSHOP_APIM_SUBSCRIPTION_KEY")

          config = config.replace("__APIM_URL__", apim_url)
          config = config.replace("__APIM_SUBSCRIPTION_KEY__", apim_key)
          config_path.write_text(config)
          PY

      - name: Deploy app folder to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "mdca/mdca dotnetdays 12/app"
          output_location: ""
          skip_app_build: true
